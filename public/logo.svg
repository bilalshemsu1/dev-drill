<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%" fill="none">
  <!-- Precision Swiss Geometric Hexagon -->
  <path d="M 128 18 L 222 72 L 222 184 L 128 238 L 34 184 L 34 72 Z"
        stroke="url(#devdrill-stroke)"
        stroke-width="14"
        stroke-linejoin="round"
        stroke-linecap="round" />
  
  <!-- Core Drill & Code Blade: Left Bracket -->
  <path d="M 98 94 L 56 128 L 98 162"
        stroke="#3b82f6"
        stroke-width="16"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- Core Drill & Code Blade: Precision Drill Chisel / Slash -->
  <line x1="148" y1="78" x2="108" y2="178"
        stroke="url(#drill-blade)"
        stroke-width="15"
        stroke-linecap="round" />

  <!-- Core Drill & Code Blade: Right Bracket -->
  <path d="M 158 94 L 200 128 L 158 162"
        stroke="#10b981"
        stroke-width="16"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <defs>
    <linearGradient id="devdrill-stroke" x1="34" y1="18" x2="222" y2="238" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="drill-blade" x1="148" y1="78" x2="108" y2="178" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>
</svg>
